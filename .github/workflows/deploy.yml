# Build IGA and publish it to GitHub Pages.
#
# Nothing here hardcodes a domain. `actions/configure-pages` reports the real
# origin and base path for this repository — which differ between a project
# page (https://user.github.io/repo/) and a custom domain (https://example/) —
# and astro.config.mjs reads them from the environment. So attaching a domain
# later is a Pages setting, not a code change.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `enablement: true` turns Pages on for the repository if it is off,
      # using the pages:write permission above. Without it the first run of a
      # fresh repo fails here, and the only fix is a manual visit to
      # Settings > Pages.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # `npm run build` is astro build *and* pagefind. Running only the former
      # ships a site whose search box silently finds nothing.
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Fail if the search index is missing
        run: test -f dist/pagefind/pagefind.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
