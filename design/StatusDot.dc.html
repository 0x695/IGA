<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-dim,oklch(66% 0.006 60));white-space:nowrap;">
  <sc-if value="{{ isActive }}" hint-placeholder-val="{{ true }}"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-active,oklch(70% 0.1 145));flex:none;"></span></sc-if>
  <sc-if value="{{ isDormant }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-dormant,oklch(68% 0.012 60));flex:none;"></span></sc-if>
  <sc-if value="{{ isDead }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;background:var(--status-dead,oklch(62% 0.09 18));flex:none;"></span></sc-if>
  <span>{{ label }}</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;active&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;active&quot;,&quot;dormant&quot;,&quot;dead&quot;]},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status;
    const labels = { active: 'Active', dormant: 'Dormant', dead: 'Dead' };
    return {
      isActive: s === 'active',
      isDormant: s === 'dormant',
      isDead: s === 'dead',
      label: this.props.label || labels[s] || s,
    };
  }
}
</script>
</body>
</html>
